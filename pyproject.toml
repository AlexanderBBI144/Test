[project]
name = "shape-codec"
version = "0.1.0"
description = "Print-robust embedding codec for t-shirts"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
poc = [
    "numpy>=2.0",
    "scipy>=1.13",
    "Pillow>=10.0",
    "openai>=1.40",
    "python-dotenv>=1.0",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "python-multipart>=0.0.9",
    "svglib>=1.5",
    "reportlab>=4.0",
]
invert = [
    "vec2text>=0.0.13",
    "torch>=2.2",
    "transformers>=4.40,<5",
    "sentence-transformers>=3.0",
    "datasets>=2.18",
]

[tool.uv]
package = false
