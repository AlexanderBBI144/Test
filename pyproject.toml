[project]
name = "tg-bot-tests"
version = "0.1.0"
description = "Telethon + pytest skeleton for Telegram bot testing"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.37",
    "cryptg>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]
poc = [
    "numpy>=2.0",
    "scipy>=1.13",
    "Pillow>=10.0",
    "scikit-learn>=1.4",
    "sentence-transformers>=3.0",
    "wordfreq>=3.0",
    "flask>=3.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.uv]
package = false
