[project]
name = "tg-bot-tests"
version = "0.1.0"
description = "Telethon + pytest skeleton for Telegram bot testing"
requires-python = ">=3.11"
dependencies = [
    "telethon>=1.37",
    "cryptg>=0.4",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.25",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.backends._legacy:_Backend"
