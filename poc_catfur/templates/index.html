<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>shape codec</title>
<style>
  :root { --navy: #0E142C; --cyan: #1FD9FE; --bg: #f6f4ee; --border: #e0dcd2; --muted: #6b6b6b; }
  * { box-sizing: border-box; }
  body { font: 14px/1.5 -apple-system, Inter, system-ui, sans-serif; background: var(--bg); margin: 0; padding: 24px; }
  .wrap { max-width: 860px; margin: 0 auto; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 4px; }
  .sub { color: var(--muted); margin-bottom: 28px; font-size: 13px; }
  .panel { background: #fff; border: 1px solid var(--border); border-radius: 10px; padding: 20px; margin-bottom: 20px; }
  label { font-weight: 500; display: block; margin-bottom: 6px; font-size: 13px; }
  input[type=text] { width: 100%; font: inherit; padding: 8px 10px; border: 1px solid var(--border); border-radius: 6px; }
  .row { display: flex; gap: 12px; margin-top: 10px; align-items: flex-end; }
  button {
    font: inherit; padding: 9px 16px; border: none;
    background: var(--navy); color: var(--cyan);
    border-radius: 6px; cursor: pointer; white-space: nowrap;
  }
  button:disabled { opacity: 0.5; cursor: wait; }
  .dropzone {
    border: 2px dashed var(--border); border-radius: 8px;
    padding: 28px; text-align: center; color: var(--muted); cursor: pointer; margin-top: 10px;
  }
  .dropzone.drag { border-color: var(--navy); color: var(--navy); }
  .preview { margin-top: 16px; }
  .preview img { max-width: 100%; border-radius: 6px; border: 1px solid var(--border); display: block; }
  a.dl { display: inline-block; margin-top: 8px; font-size: 13px; color: var(--navy); }
  ol.phrases { margin: 12px 0 0; padding-left: 20px; line-height: 2; }
  ol.phrases li:first-child { font-weight: 600; }
  .err { color: #a33; margin-top: 8px; font-size: 13px; }
  .spinner { display: inline-block; width: 14px; height: 14px; border: 2px solid var(--cyan); border-top-color: transparent; border-radius: 50%; animation: spin .7s linear infinite; margin-right: 6px; vertical-align: middle; }
  @keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="wrap">
  <h1>shape codec</h1>
  <div class="sub">phrase → ada-002 → printed pattern → photo → vec2text → top-10 phrases</div>

  <div class="panel">
    <label for="shapeText">phrase to encode</label>
    <div class="row">
      <input id="shapeText" type="text" value="i love geese" autofocus style="flex:1">
      <button id="encodeBtn">generate SVG</button>
    </div>
    <div id="encodeResult" class="preview" style="display:none">
      <img id="svgPreview" alt="pattern preview">
      <a id="svgDownload" class="dl" download="pattern.svg">↓ download SVG</a>
    </div>
    <div id="encodeErr" class="err" style="display:none"></div>
  </div>

  <div class="panel">
    <label>decode shirt photo</label>
    <div id="drop" class="dropzone">click or drag a photo here</div>
    <input id="fileInput" type="file" accept="image/*" style="display:none">
    <div id="decodeResult" style="display:none; margin-top:14px">
      <label>top-10 phrases</label>
      <ol id="phraseList" class="phrases"></ol>
    </div>
    <div id="decodeErr" class="err" style="display:none"></div>
  </div>
</div>

<script>
const $ = id => document.getElementById(id);

$("encodeBtn").addEventListener("click", async () => {
  const btn = $("encodeBtn");
  btn.disabled = true;
  btn.innerHTML = '<span class="spinner"></span>encoding…';
  $("encodeErr").style.display = "none";
  try {
    const r = await fetch("/api/shape/encode", {
      method: "POST",
      headers: {"Content-Type": "application/json"},
      body: JSON.stringify({text: $("shapeText").value}),
    });
    const d = await r.json();
    if (!d.ok) throw new Error(d.detail || "encode failed");
    $("svgPreview").src = d.svg_b64;
    $("svgDownload").href = URL.createObjectURL(new Blob([d.svg], {type: "image/svg+xml"}));
    $("encodeResult").style.display = "";
  } catch(e) {
    $("encodeErr").textContent = e.message;
    $("encodeErr").style.display = "";
  } finally {
    btn.disabled = false;
    btn.textContent = "generate SVG";
  }
});

$("shapeText").addEventListener("keydown", e => { if (e.key === "Enter") $("encodeBtn").click(); });

const drop = $("drop");
drop.addEventListener("click", () => $("fileInput").click());
drop.addEventListener("dragover", e => { e.preventDefault(); drop.classList.add("drag"); });
drop.addEventListener("dragleave", () => drop.classList.remove("drag"));
drop.addEventListener("drop", e => { e.preventDefault(); drop.classList.remove("drag"); if (e.dataTransfer.files[0]) decode(e.dataTransfer.files[0]); });
$("fileInput").addEventListener("change", () => { if ($("fileInput").files[0]) decode($("fileInput").files[0]); });

async function decode(file) {
  drop.innerHTML = '<span class="spinner"></span>decoding…';
  $("decodeErr").style.display = "none";
  $("decodeResult").style.display = "none";
  const fd = new FormData();
  fd.append("image", file);
  try {
    const r = await fetch("/api/shape/decode", {method: "POST", body: fd});
    const d = await r.json();
    if (d.ok) {
      const ol = $("phraseList");
      ol.innerHTML = "";
      for (const p of d.phrases) { const li = document.createElement("li"); li.textContent = p; ol.appendChild(li); }
      $("decodeResult").style.display = "";
    } else {
      $("decodeErr").textContent = d.error || "decode failed";
      $("decodeErr").style.display = "";
    }
  } catch(e) {
    $("decodeErr").textContent = e.message;
    $("decodeErr").style.display = "";
  } finally {
    drop.textContent = "click or drag a photo here";
  }
}
</script>
</body>
</html>
